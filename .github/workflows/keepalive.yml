name: Keep API awake

# Render's free web service sleeps after 15 minutes without traffic and then
# needs about a minute to wake. This pings the dependency-free /ping endpoint
# every 10 minutes during European daytime so visitors don't hit a cold start.
#
# Why daytime only: Render's 750 free instance hours per month are shared by
# every free service in the workspace (the Electricity Forecaster API lives
# there too). Awake 24/7 would use ~744 h on its own; 05:00-20:50 UTC
# (07:00-22:50 Berlin summer time) is ~500 h, leaving room for the others.
# Outside that window the API sleeps and simply wakes on the first request.
#
# Needs the repository variable API_URL (Settings → Secrets and variables →
# Actions → Variables), e.g. https://career-os-api.onrender.com
#
# GitHub may run scheduled jobs a few minutes late, and pauses schedules in
# public repos after 60 days with no commits — re-enable in the Actions tab.

on:
  schedule:
    - cron: "*/10 5-20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /ping
        run: curl -fsS --max-time 120 "${{ vars.API_URL }}/ping" || echo "API did not answer (it may be waking up)"
