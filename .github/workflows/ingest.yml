name: Daily job ingestion

# Free-hosting replacement for a long-running Prefect worker + Celery
# worker. Once a day a GitHub-hosted runner pulls fresh jobs from Adzuna,
# Reed and Remotive, embeds them into Qdrant Cloud and extracts skills with
# Groq, writing straight to the Neon database. Tasks run inline
# (TASKS_INLINE), so no Redis or worker process is needed.
#
# Also runnable by hand: Actions tab → "Daily job ingestion" → Run workflow.
# Use that once right after setting the secrets to fill the empty database.
#
# Note: GitHub pauses scheduled workflows in public repos after 60 days with
# no commits. If the data stops refreshing, re-enable it in the Actions tab.

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily (off the hour to dodge queue spikes)
  workflow_dispatch:

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      TASKS_INLINE: "true"
      SKILL_EXTRACTION_DELAY_S: "2.5"   # ≈24 Groq calls/min, under the free limit
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
      PREFECT_HOME: /tmp/prefect
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL_EXTRACTION: openai/gpt-oss-20b
      GROQ_MODEL_ADVISOR: openai/gpt-oss-120b
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      REED_API_KEY: ${{ secrets.REED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check secrets are set
        run: |
          for v in POSTGRES_URL QDRANT_URL GROQ_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; exit 1; fi
          done

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed skill taxonomy (idempotent)
        working-directory: backend
        run: python -m app.scripts.seed_skills

      - name: Ensure Qdrant collections exist
        working-directory: backend
        run: python -c "import asyncio; from app.main import _ensure_qdrant_collections as f; asyncio.run(f())"

      - name: Ingest jobs (fetch, dedup, embed, extract skills)
        run: python -m data_pipeline.flows.ingestion_flow

      - name: Daily market snapshot (feeds the forecaster)
        run: python -m data_pipeline.flows.snapshot_flow

      - name: Wake the API
        if: ${{ vars.API_URL != '' }}
        run: curl -fsS --max-time 120 "${{ vars.API_URL }}/ping" || true
